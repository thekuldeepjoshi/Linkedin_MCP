services:
  - type: web
    name: linkbridge-mcp
    runtime: docker
    plan: standard
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: linkbridge-profile
      mountPath: /home/pwuser/.linkedin-mcp
      sizeGB: 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TRANSPORT
        value: streamable-http
      - key: HOST
        value: 0.0.0.0
